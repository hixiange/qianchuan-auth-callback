<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>巨量千川授权回调</title>
<style>body{font:16px system-ui;background:#f6f7fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center}.card{max-width:560px;margin:24px;background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:32px}p{line-height:1.6}.code{padding:16px;background:#f0f3f8;border-radius:10px}button{padding:12px;border:0;border-radius:9px;background:#2457d6;color:white;font-size:15px}button:disabled{opacity:.5}</style>
</head><body><main class="card"><h1>巨量千川授权回调</h1><p id="status">尚未收到授权结果</p>
<div id="code" class="code">尚未收到授权结果</div><p><button id="copy" disabled>复制一次性授权结果（含校验标识）</button></p>
<p>仅粘贴至本次本机验收页。不要发到聊天、问卷或交给他人；本页不发送网络请求、不保存凭证。</p></main>
<script>(() => {
  const status = document.getElementById('status'), view = document.getElementById('code'), button = document.getElementById('copy');
  const url = new URL(location.href);
  let code = url.searchParams.get('auth_code'), state = url.searchParams.get('state');
  const unique = url.searchParams.getAll('auth_code').length === 1 && url.searchParams.getAll('state').length === 1;
  const redirect = url.origin + url.pathname;
  history.replaceState(null, '', redirect);
  url.search = '';
  if (!unique || !code || code.length > 4096 || !/^[a-f0-9]{64}$/.test(state || '')) {
    status.textContent = '未收到完整的授权码与本次校验标识，请停止并返回本机验收页';
    code = null; state = null; return;
  }
  let payload = JSON.stringify({ version: 1, auth_code: code, state, redirect_uri: redirect });
  code = null; state = null;
  status.textContent = '已收到一次性授权结果，state须由本机验收页核验';
  view.textContent = '授权内容已隐藏，不在页面明文展示';
  button.disabled = false;
  button.onclick = async () => {
    try {
      await navigator.clipboard.writeText(payload);
      payload = '';
      status.textContent = '已复制，请仅粘贴到本次本机验收页后关闭本页';
      button.disabled = true;
    } catch { status.textContent = '复制失败，请勿截图或转发授权内容'; }
  };
})();</script></body></html>
