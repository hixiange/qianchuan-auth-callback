<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巨量千川授权回调</title><style>body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,calc(100% - 40px));background:#fff;border:1px solid #e3e7ef;border-radius:18px;padding:32px;box-shadow:0 12px 40px #18243d12}h1{font-size:24px;margin:0 0 10px}p{line-height:1.6;color:#596579}.code{margin:22px 0;padding:16px;border-radius:10px;background:#f0f3f8;word-break:break-all;font-family:ui-monospace,monospace;min-height:24px}.button{border:0;border-radius:9px;padding:11px 18px;background:#2457d6;color:#fff;font-size:15px;cursor:pointer}.note{font-size:14px;margin-top:24px}</style></head><body><main class=card><h1>巨量千川授权回调</h1><p id=status>尚未收到授权码</p><div id=code class=code aria-live=polite>尚未收到授权码</div><button id=copy class=button disabled>复制授权码</button><p class=note>授权码仅供自己的本机连接页使用，请勿填写问卷或转交他人。复制使用后请关闭本页。</p></main><script>(()=>{const s=document.getElementById('status'),c=document.getElementById('code'),b=document.getElementById('copy');const u=new URL(location.href),code=u.searchParams.get('auth_code');history.replaceState(null,'',u.origin+u.pathname);if(!code){return}let value=code;s.textContent='已收到授权码';c.textContent=value;b.disabled=false;b.onclick=async()=>{await navigator.clipboard.writeText(value);s.textContent='已复制授权码，请关闭本页';value='';c.textContent='已复制，页面内存中的授权码已清除';b.disabled=true}})();</script></body></html>
